
services:


  semantic-backend:

    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: semantic-backend
    working_dir: /app
    volumes:
      - ./server:/app
      - ./server/uploads:/app/uploads
      - ./dist:/app/dist
      
      
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:            
     
      - AWS_REGION=local
      - S3_BUCKET=local-invoices
      - SENDGRID_API_KEY=dev-placeholder
      - EMAIL_FROM=admin@upsc-learning.com
      - RAZORPAY_KEY_ID=rzp_test_stub
      - RAZORPAY_KEY_SECRET=stub-secret
      - RAZORPAY_WEBHOOK_SECRET=stub-webhook
      - FRONTEND_URL=http://localhost:4173
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy

     
    restart: always
    networks:
      - sambit-net
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  
  ingestor:
    build:
      context: ./vector_server
      dockerfile: Dockerfile
    container_name: aryabhata-ingestor
    working_dir: /app
    command: uvicorn ingest_hybrid_api:app --host 0.0.0.0 --port 7860
    ports:
      - "7860:7860"
    volumes:
      - ./vector_server:/app
     
      
    env_file:
      - ./vector_server/.env
 

    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sambit-net

  ingest-job:
    build:
      context: ./vector_server
      dockerfile: Dockerfile
    working_dir: /app
    command: python ingest_hybrid.py --folder /app/data/geography
    volumes:
      - ./vector_server:/app
    env_file:
      - ./vector_server/.env
    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"
    profiles:
      - ingest
    networks:
      - sambit-net

  postgres:
    image: ankane/pgvector:latest
    container_name: aryabhata-db
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: always
    networks:
      sambit-net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: aryabhata-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sambit-net

  redis:
    image: redis:7-alpine
    container_name: aryabhata-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - sambit-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
          
              


  # pgadmin removed from production — use psql or a DB GUI via SSH tunnel
  # Uncomment below for local dev only:
  #
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: aryabhata-pgadmin
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin:/var/lib/pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: always
  #   networks:
  #     - sambit-net



  # worker removed (phone-only chat uses on-device LLM)

volumes:

  postgres:
  pgadmin:
  chroma_data:
  redis_data:

networks:
  sambit-net:
    driver: bridge
