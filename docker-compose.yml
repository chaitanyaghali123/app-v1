
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_BACKEND_URL: "http://localhost:3000"
    ports:
      - "4173:4173"
    environment:
      - VITE_BACKEND_URL=http://localhost:3000

      - VITE_ASK_API=/ask
      - VITE_LLM_API=/llm
    depends_on:
      - semantic-backend
    networks:
      - sambit-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4173"]
      interval: 10s
      timeout: 5s
      retries: 5

  semantic-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: semantic-backend
    working_dir: /app
    volumes:
      - ./server:/app
      - ./server/uploads:/app/uploads   # ✅ ADD THIS LINE
      
      
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:            
     
      - AWS_REGION=local
      - S3_BUCKET=local-invoices
      - SENDGRID_API_KEY=dev-placeholder
      - EMAIL_FROM=admin@upsc-learning.com
      - RAZORPAY_KEY_ID=rzp_test_stub
      - RAZORPAY_KEY_SECRET=stub-secret
      - RAZORPAY_WEBHOOK_SECRET=stub-webhook
      - FRONTEND_URL=http://localhost:4173
      - KAFKA_BROKER=kafka:9092 # ✅ point backend to Kafka
      - KAFKAJS_NO_PARTITIONER_WARNING=1
      - LLAMA_API_URL=http://llama-server:8080
      - LLAMA_MODEL=qwen2.5-0.5b-instruct-q4_k_m.gguf
      - MOBILE_POLISH_MODE=full
      - MOBILE_POLISH_TIMEOUT_MS=600000
      - MOBILE_POLISH_MAX_TOKENS=900
      
    depends_on:
      - postgres
      - chromadb
      
      - n8n
      - kafka # ✅ ensure Kafka starts before backend
      - redis
     
    restart: always
    networks:
      - sambit-net
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  
  ingestor:
    build:
      context: ./vector_server
      dockerfile: Dockerfile
    container_name: aryabhata-ingestor
    working_dir: /app
    command: >
        sh -c "
        python ingest_hybrid.py --folder /app/data/UPSC_DOC &&
        uvicorn ingest_hybrid_api:app --host 0.0.0.0 --port 7860
        "
    ports:
      - "7860:7860"
    volumes:
      - ./vector_server:/app
     
      
    env_file:
      - ./vector_server/.env
 

    depends_on:
      chromadb:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sambit-net

  postgres:
    image: ankane/pgvector:latest
    container_name: aryabhata-db
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: always
    networks:
      sambit-net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: aryabhata-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sambit-net
    
          
              


  pgadmin:
    image: dpage/pgadmin4
    container_name: aryabhata-pgadmin
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - sambit-net

  n8n:
    image: n8nio/n8n
    container_name: aryabhata-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - TZ=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always
    networks:
      - sambit-net




  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - sambit-net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - sambit-net
    healthcheck:  
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aryabhata-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sambit-net
    restart: always
  
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: llm-worker
    working_dir: /app
    volumes:
      - ./server:/app
     
    command: ["node", "worker.js"]
    env_file:
      - ./server/.env
    environment:
  
      - BATCH_SIZE=5
      - BATCH_TIME=200
    depends_on:
      - redis 
     
    restart: always
    networks:
      - sambit-net

  llama-server:
    build:
      context: ./llama
      dockerfile: Dockerfile
    container_name: llama-server
    volumes:
        - ./models:/models 
    environment:
        - LLAMA_MODEL_PATH=/models/qwen2.5-0.5b-instruct-q4_k_m.gguf
        - LLAMA_THREADS=8
        - LLAMA_CTX_SIZE=1536
    ports:
        - "8080:8080"
    networks:
        - sambit-net
    restart: unless-stopped




      




volumes:
  postgres:
  pgadmin:
  chroma_data:
  n8n_data:

  redis_data:   # ✅ declare the named volume here
networks:
  sambit-net:
    driver: bridge
