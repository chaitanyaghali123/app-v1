
services:


  semantic-backend:

    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: semantic-backend
    working_dir: /app
    # The image ships CMD ["node", "server.js"] and installs with --omit=dev, so
    # without this the running server never picks up edits made to ./server and
    # keeps serving the code loaded at start-up. nodemon runs with --legacy-watch
    # because file-watch events do not propagate through a Windows bind mount on
    # Docker Desktop, so it polls for changes instead.
    command: node node_modules/nodemon/bin/nodemon.js --legacy-watch --watch controllers --watch services --watch routes --watch middleware server.js
    volumes:
      - ./server:/app
      - ./server/uploads:/app/uploads
      - ./dist:/app/dist
      - ./diagram-assets:/app/diagram-assets
      
      
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:            
     
      - AWS_REGION=local
      - S3_BUCKET=local-invoices
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-dev-placeholder}
      - EMAIL_FROM=${EMAIL_FROM:-admin@upsc-learning.com}
      - RAZORPAY_KEY_ID=rzp_test_stub
      - RAZORPAY_KEY_SECRET=stub-secret
      - RAZORPAY_WEBHOOK_SECRET=stub-webhook
      - FRONTEND_URL=http://localhost:4173
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_KEY_VAULT_PROVIDER=${GEMINI_KEY_VAULT_PROVIDER:-local-envelope}
      - GEMINI_KMS_KEY_ID=${GEMINI_KMS_KEY_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

     
    restart: always
    networks:
      - sambit-net
    healthcheck:
      test: ["CMD", "curl", "-s", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:0.8.6-pg15
    container_name: aryabhata-db
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: always
    networks:
      sambit-net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aryabhata-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - sambit-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    
          
              


  # pgadmin removed from production — use psql or a DB GUI via SSH tunnel
  # Uncomment below for local dev only:
  #
  # pgadmin:
  #   image: dpage/pgadmin4
  #   container_name: aryabhata-pgadmin
  #   ports:
  #     - "5050:80"
  #   volumes:
  #     - pgadmin:/var/lib/pgadmin
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: always
  #   networks:
  #     - sambit-net




volumes:

  postgres:
  pgadmin:
  redis_data:

networks:
  sambit-net:
    driver: bridge
